  *{margin:0;padding:0;box-sizing:border-box;} body{background:#050B1A;}
  #s11{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;color:#F8FAFC;
    background:radial-gradient(135% 100% at 50% 12%,#0E2240 0%,#091833 40%,#050B1A 78%);
    --cy:#18D7FF;--bl:#2563FF;--vi:#7C5CFF;--gr:#34D399;--am:#F59E0B;--rd:#EF4444;--sl:#94A3B8;}
  #s11 .world{position:absolute;inset:0;transform-origin:50% 42%;}
  #s11 .orb{position:absolute;border-radius:50%;filter:blur(70px);z-index:0;opacity:0;pointer-events:none;}
  #s11 .orb.a{width:720px;height:720px;left:-180px;top:440px;background:radial-gradient(circle,rgba(37,99,255,.28),rgba(37,99,255,0) 68%);}
  #s11 .orb.b{width:620px;height:620px;right:-200px;top:980px;background:radial-gradient(circle,rgba(124,92,255,.24),rgba(124,92,255,0) 68%);}
  #s11 .orb.c{width:520px;height:520px;left:50%;top:1320px;transform:translateX(-50%);background:radial-gradient(circle,rgba(24,215,255,.18),rgba(24,215,255,0) 68%);}
  #s11 .flash{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;background:radial-gradient(120% 75% at 50% 24%,rgba(37,99,255,.4),rgba(37,99,255,0) 60%);}
  #s11 .sweep{position:absolute;top:-10%;left:-60%;width:55%;height:120%;z-index:4;opacity:0;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(120,180,255,.10) 45%,rgba(190,225,255,.18) 50%,rgba(120,180,255,.10) 55%,transparent);transform:skewX(-12deg);filter:blur(8px);}
  #s11 .grain{position:absolute;inset:0;z-index:6;opacity:.035;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  #s11 .vignette{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(125% 85% at 50% 42%,transparent 58%,rgba(2,6,16,.5) 100%);}
  #s11 .content{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding:128px 80px 92px;}

  #s11 .badge{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(24,215,255,.45);border-radius:100px;padding:11px 22px;font-size:25px;font-weight:600;letter-spacing:.5px;color:#CFE8FF;background:rgba(24,215,255,.06);}
  #s11 .badge .gd{width:11px;height:11px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy);}
  #s11 .hl{font-family:'DM Sans',sans-serif;font-weight:700;text-align:center;font-size:58px;line-height:1.06;letter-spacing:-1px;margin-top:24px;max-width:880px;}
  #s11 .hl .ac{color:var(--cy);}
  #s11 .divider{position:relative;margin:26px 0 8px;height:1.5px;width:170px;}
  #s11 .divider .line{position:absolute;inset:0;border-radius:2px;transform:scaleX(0);background:linear-gradient(90deg,transparent,var(--cy),transparent);}
  #s11 .divider .node{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:#d6f3ff;box-shadow:0 0 20px 5px rgba(24,215,255,.85);opacity:0;}

  #s11 .stage{position:relative;width:100%;flex:1;margin-top:30px;display:flex;align-items:center;justify-content:center;}
  #s11 .stagei{position:relative;width:100%;}

  #s11 .outcome{text-align:center;font-size:37px;font-weight:600;line-height:1.25;color:#D7E4F4;max-width:820px;margin-top:14px;}
  #s11 .outcome .ac{color:var(--cy);}
  #s11 .foot{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:22px;}
  #s11 .cta{font-size:32px;font-weight:700;color:#06101F;background:linear-gradient(135deg,#29D8F6,#2C7CFF);padding:18px 40px;border-radius:16px;box-shadow:0 0 44px rgba(37,99,255,.45);}
  #s11 .logo{display:flex;align-items:center;gap:16px;position:relative;}
  #s11 .logo .ring2{position:absolute;left:6px;top:50%;width:60px;height:60px;border-radius:50%;transform:translate(-10%,-50%) scale(.4);border:2px solid rgba(24,215,255,.7);opacity:0;}
  #s11 .logo .mark{width:52px;height:52px;filter:drop-shadow(0 6px 18px rgba(37,99,255,.45));}
  #s11 .logo .wm{font-size:46px;font-weight:600;color:#F4F8FF;}

  /* shared centerpiece primitives */
  #s11 .card{position:relative;border-radius:22px;background:linear-gradient(165deg,rgba(24,42,74,.8),rgba(11,22,46,.88));border:1px solid rgba(120,180,255,.26);box-shadow:0 30px 70px rgba(2,8,24,.5),inset 0 1px 0 rgba(255,255,255,.07);}
  #s11 .tile{display:flex;align-items:center;justify-content:center;border-radius:13px;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  #s11 .tile svg{stroke:#fff;}
  #s11 .t-cy{background:linear-gradient(135deg,#29D8F6,#1597D6);} #s11 .t-bl{background:linear-gradient(135deg,#3B7BFF,#1E47D6);}
  #s11 .t-vi{background:linear-gradient(135deg,#8E73FF,#6A45E6);} #s11 .t-gr{background:linear-gradient(135deg,#34D399,#10b981);}
  #s11 .t-am{background:linear-gradient(135deg,#FFC24B,#F59E0B);} #s11 .t-gy{background:linear-gradient(135deg,#3a4658,#2a3343);}
  #s11 .chk{border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--bl));display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(24,215,255,.5);}
  #s11 .chk svg{stroke:#fff;}


  #s11 .kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:880px;margin:0 auto;}
  #s11 .col{background:rgba(255,255,255,.03);border:1px solid rgba(120,160,220,.12);border-radius:16px;padding:14px 12px;min-height:380px;}
  #s11 .colh{font-size:21px;font-weight:700;text-align:center;margin-bottom:14px;color:#cdd8e8;}
  #s11 .col.won .colh{color:var(--cy);}
  #s11 .kcard{background:linear-gradient(165deg,rgba(24,42,74,.85),rgba(11,22,46,.9));border:1px solid rgba(120,180,255,.22);border-radius:12px;padding:13px;margin-bottom:11px;display:flex;align-items:center;gap:11px;font-size:20px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.3);}
  #s11 .kcard .kd{width:28px;height:28px;border-radius:8px;flex:0 0 28px;}
 </style></head><body>
<div id="s11" data-composition-id="svc11" data-start="0" data-duration="9.0" data-width="1080" data-height="1920">
 <div class="world">

  <div class="flash"></div><div class="sweep"></div>

      <div class="logo"><div class="ring2"></div><svg class="mark" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="lgs11" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#18D7FF"/><stop offset=".5" stop-color="#2563FF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs><rect x="13" y="7" width="14" height="50" rx="7" fill="url(#lgs11)"/><rect x="13" y="43" width="40" height="14" rx="7" fill="url(#lgs11)"/><rect x="33" y="7" width="11" height="28" rx="5.5" fill="#18D7FF"/></svg><div class="wm">LeadaLine</div></div>
    </div>
  </div>
  <div class="vignette"></div><div class="grain"></div>
 </div>
 <script src="./gsap.min.js"></script>
 <script>
  window.__timelines=window.__timelines||{};
  const tl=gsap.timeline({paused:true}); const S=(q)=>"#s11 "+q;
  const SOFT="power3.out",SMOOTH="power2.out",POP="back.out(1.8)";
  tl.to(S(".orb.a"),{opacity:1,duration:1.0,ease:"sine.out"},0);
  tl.to(S(".orb.b"),{opacity:1,duration:1.1,ease:"sine.out"},0.1);
  tl.to(S(".orb.c"),{opacity:1,duration:1.1,ease:"sine.out"},0.2);
  tl.fromTo(S(".flash"),{opacity:0},{opacity:0.85,duration:0.1},0);
  tl.to(S(".flash"),{opacity:0,duration:0.45,ease:"power2.in"},0.12);
  tl.from(S(".world"),{scale:1.05,duration:0.6,ease:SOFT,transformOrigin:"50% 40%"},0);
  tl.from(S(".badge"),{y:-18,scale:0.85,opacity:0,duration:0.4,ease:POP},0.2);
  tl.from(S(".hl"),{y:30,opacity:0,duration:0.45,ease:SOFT},0.4);
  tl.to(S(".divider .line"),{scaleX:1,duration:0.34,ease:"power2.inOut"},0.85);
  tl.to(S(".divider .node"),{opacity:1,duration:0.3},1.08);
  tl.fromTo(S(".sweep"),{x:0,opacity:0},{opacity:1,duration:0.25,ease:"sine.out"},0.7);
  tl.to(S(".sweep"),{x:2200,duration:1.2,ease:"power1.inOut"},0.7);
  tl.to(S(".sweep"),{opacity:0,duration:0.3},1.6);
  function outro(t){
    tl.from(S(".outcome"),{y:20,opacity:0,duration:0.45,ease:SOFT},t);
    tl.from(S(".cta"),{y:20,opacity:0,duration:0.45,ease:POP},t+0.25);
    tl.fromTo(S(".cta"),{boxShadow:"0 0 30px rgba(37,99,255,.3)"},{boxShadow:"0 0 60px rgba(37,99,255,.65)",duration:0.6,ease:"sine.inOut",yoyo:true,repeat:1},t+0.6);
    tl.from(S(".logo .mark"),{scale:0.5,opacity:0,duration:0.45,ease:"back.out(2)"},t+0.4);
    tl.from(S(".logo .wm"),{x:-18,opacity:0,duration:0.45,ease:SOFT},t+0.52);
    tl.fromTo(S(".logo .ring2"),{scale:0.4,opacity:0.9},{scale:1.8,opacity:0,duration:0.8,ease:"power2.out",immediateRender:false},t+0.52);
    tl.to(S(".stage"),{y:-6,duration:1.8,ease:"sine.inOut",yoyo:true,repeat:1},t+0.3);
  }

  tl.from(S(".col"),{y:30,opacity:0,duration:0.42,ease:SOFT,stagger:0.14},1.4);
  tl.from(S(".col .colh"),{opacity:0,y:-8,duration:0.3,stagger:0.14},1.6);
  var cards=gsap.utils.toArray(S(".kcard"));
  cards.forEach((el,i)=>{ tl.from(el,{x:-40,opacity:0,scale:0.9,duration:0.4,ease:POP},2.2+i*0.32); });
 
  outro(6.8);
  window.__timelines["svc11"]=tl;
</script>
