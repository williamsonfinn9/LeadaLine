<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><style>
@font-face{font-family:'Archivo';font-weight:800;font-display:block;src:url('fonts/Archivo-800.woff2') format('woff2');}
@font-face{font-family:'Archivo';font-weight:900;font-display:block;src:url('fonts/Archivo-900.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-weight:400;font-display:block;src:url('fonts/DMSans-400.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-weight:500;font-display:block;src:url('fonts/DMSans-500.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-weight:600;font-display:block;src:url('fonts/DMSans-600.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-weight:700;font-display:block;src:url('fonts/DMSans-700.woff2') format('woff2');}
@font-face{font-family:'DM Mono';font-weight:500;font-display:block;src:url('fonts/DMMono-500.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box;}body{background:#050B1A;}
#r{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;color:#F8FAFC;
  background:radial-gradient(135% 100% at 50% 14%,#0E2240 0%,#091833 42%,#050B1A 80%);
  --cy:#18D7FF;--bl:#2563FF;--vi:#7C5CFF;--gr:#2BD07A;}
#r .world{position:absolute;inset:0;transform-origin:50% 42%;}
#r .orb{position:absolute;border-radius:50%;filter:blur(74px);z-index:0;opacity:0;}
#r .orb.a{width:760px;height:760px;left:-200px;top:420px;background:radial-gradient(circle,rgba(37,99,255,.30),rgba(37,99,255,0) 68%);}
#r .orb.b{width:680px;height:680px;right:-220px;top:1080px;background:radial-gradient(circle,rgba(124,92,255,.26),rgba(124,92,255,0) 68%);}
#r .grain{position:absolute;inset:0;z-index:6;opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
#r .vignette{position:absolute;inset:0;z-index:5;background:radial-gradient(125% 85% at 50% 40%,transparent 56%,rgba(2,6,16,.55) 100%);}
#r .sweep{position:absolute;top:-10%;left:-60%;width:55%;height:120%;z-index:4;opacity:0;
  background:linear-gradient(105deg,transparent,rgba(120,180,255,.10) 45%,rgba(190,225,255,.20) 50%,rgba(120,180,255,.10) 55%,transparent);transform:skewX(-12deg);filter:blur(8px);}
#r .content{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding:180px 96px 150px;}
#r .kick{font-family:'DM Mono',monospace;font-weight:500;font-size:30px;letter-spacing:5px;text-transform:uppercase;color:#8FB4E8;opacity:0;}
#r .head{font-family:'Archivo';font-weight:900;text-transform:uppercase;text-align:center;font-size:104px;line-height:.95;letter-spacing:-2.5px;margin-top:24px;}
#r .head .g{background:linear-gradient(120deg,#18D7FF,#2563FF 55%,#7C5CFF);-webkit-background-clip:text;background-clip:text;color:transparent;}
#r .head .l{display:block;opacity:0;}
#r .sub{text-align:center;font-size:40px;font-weight:500;color:#BFD0E6;margin-top:30px;opacity:0;}
#r .steps{margin-top:78px;width:100%;max-width:820px;display:flex;flex-direction:column;gap:26px;}
#r .step{display:flex;align-items:center;gap:26px;background:linear-gradient(120deg,rgba(28,48,84,.7),rgba(12,24,50,.72));
  border:1px solid rgba(120,180,255,.20);border-radius:24px;padding:30px 34px;opacity:0;position:relative;overflow:hidden;}
#r .step .tick{width:66px;height:66px;flex:0 0 66px;border-radius:50%;border:2.5px solid rgba(148,163,184,.3);
  display:flex;align-items:center;justify-content:center;transition:none;}
#r .step .tick svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:3.2;opacity:0;}
#r .step.done .tick{background:linear-gradient(135deg,var(--cy),var(--bl));border-color:transparent;box-shadow:0 0 26px rgba(24,215,255,.55);}
#r .step .txt{flex:1;}
#r .step .st{font-size:38px;font-weight:700;color:#EAF2FB;}
#r .step .ss{font-size:26px;font-weight:500;color:#9FB2CC;margin-top:4px;}
#r .step .no{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:#6E82A0;}
#r .live{margin-top:70px;position:relative;opacity:0;display:flex;flex-direction:column;align-items:center;gap:18px;}
#r .live .badge{display:inline-flex;align-items:center;gap:18px;background:linear-gradient(120deg,var(--bl),#1b4fd6);
  border-radius:100px;padding:26px 46px;box-shadow:0 20px 54px rgba(37,99,255,.5),0 0 60px rgba(124,92,255,.4);}
#r .live .badge .dot{width:24px;height:24px;border-radius:50%;background:#7CF6B0;box-shadow:0 0 20px rgba(124,246,176,.9);}
#r .live .badge .bt{font-family:'Archivo';font-weight:800;font-size:52px;letter-spacing:-.5px;}
#r .logo{position:absolute;left:0;right:0;bottom:120px;display:flex;align-items:center;justify-content:center;gap:20px;opacity:0;}
#r .logo .mark{width:60px;height:60px;filter:drop-shadow(0 6px 18px rgba(37,99,255,.45));}
#r .logo .wm{font-size:54px;font-weight:600;letter-spacing:-.5px;color:#F4F8FF;}
</style></head>
<body>
<div id="r" data-composition-id="reelN2" data-start="0" data-duration="8" data-width="1080" data-height="1920">
  <div class="world">
    <div class="orb a"></div><div class="orb b"></div>
    <div class="content">
      <div class="kick">Done for you</div>
      <div class="head"><span class="l">YOUR AI OFFICE</span><span class="l g">LIVE IN 48 HOURS</span></div>
      <div class="sub">No tech skills. No new systems to learn.</div>
      <div class="steps">
        <div class="step" id="s1"><div class="tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="txt"><div class="st">We connect your number</div><div class="ss">Calls &amp; enquiries flow straight in</div></div><div class="no">01</div></div>
        <div class="step" id="s2"><div class="tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="txt"><div class="st">We train it on your trade</div><div class="ss">Your services, your area, your prices</div></div><div class="no">02</div></div>
        <div class="step" id="s3"><div class="tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="txt"><div class="st">You go live</div><div class="ss">Every lead answered from day one</div></div><div class="no">03</div></div>
      </div>
      <div class="live"><div class="badge"><span class="dot"></span><span class="bt">You're live.</span></div></div>
      <div class="logo">
        <svg class="mark" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="lg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#18D7FF"/><stop offset=".5" stop-color="#2563FF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs><rect x="13" y="7" width="14" height="50" rx="7" fill="url(#lg)"/><rect x="13" y="43" width="40" height="14" rx="7" fill="url(#lg)"/><rect x="33" y="7" width="11" height="28" rx="5.5" fill="#18D7FF"/></svg>
        <div class="wm">LeadaLine</div>
      </div>
    </div>
    <div class="sweep"></div><div class="vignette"></div><div class="grain"></div>
  </div>
  <script src="./gsap.min.js"></script>
  <script>
  window.__timelines=window.__timelines||{};
  const tl=gsap.timeline({paused:true});
  const snap="back.out(1.7)",soft="power3.out";
  tl.to("#r .orb.a",{opacity:1,duration:1,ease:"sine.out"},0);
  tl.to("#r .orb.b",{opacity:1,duration:1.1,ease:"sine.out"},.1);
  tl.from("#r .world",{scale:1.05,duration:.6,ease:"power3.out"},0);
  tl.to("#r .kick",{opacity:1,duration:.3,ease:soft},.2);
  tl.from("#r .head .l",{y:40,opacity:0,duration:.4,stagger:.14,ease:snap},.3);
  tl.to("#r .head .l",{opacity:1,duration:.01},.3);
  tl.to("#r .sub",{opacity:1,duration:.35,ease:soft},.95);
  // first light sweep
  tl.fromTo("#r .sweep",{x:0,opacity:0},{opacity:1,duration:.25,ease:"sine.out"},.7);
  tl.to("#r .sweep",{x:2200,duration:1.1,ease:"power1.inOut"},.7);
  tl.to("#r .sweep",{opacity:0,duration:.3},1.6);
  // steps appear + tick in sequence
  function step(id,at){
    tl.to(id,{opacity:1,duration:.34,ease:soft},at);
    tl.from(id,{y:34,duration:.34,ease:snap},at);
    tl.add(()=>{document.querySelector(id).classList.add("done");},at+.55);
    tl.fromTo(id+" .tick",{scale:1},{scale:1.18,duration:.16,ease:"power2.out"},at+.55);
    tl.to(id+" .tick",{scale:1,duration:.3,ease:"power2.inOut"},at+.71);
    tl.to(id+" .tick svg",{opacity:1,duration:.2,ease:soft},at+.58);
  }
  step("#s1",1.7);
  step("#s2",3.0);
  step("#s3",4.3);
  // "You're live" badge pops
  tl.to("#r .live",{opacity:1,duration:.01},5.5);
  tl.from("#r .live .badge",{scale:.7,opacity:0,duration:.5,ease:"back.out(2)"},5.5);
  tl.to("#r .live .badge",{boxShadow:"0 20px 60px rgba(37,99,255,.75),0 0 80px rgba(124,92,255,.7)",duration:.5,ease:"sine.inOut",yoyo:true,repeat:3},5.9);
  tl.to("#r .live .badge .dot",{opacity:.3,duration:.5,ease:"sine.inOut",yoyo:true,repeat:4},6.0);
  // logo
  tl.to("#r .logo",{opacity:1,duration:.4},6.4);
  tl.from("#r .logo .mark",{scale:.55,opacity:0,duration:.5,ease:"back.out(2)"},6.4);
  tl.from("#r .logo .wm",{x:-20,opacity:0,duration:.5,ease:soft},6.55);
  tl.fromTo("#r .sweep",{x:0,opacity:0},{opacity:.7,duration:.3,ease:"sine.out"},6.7);
  tl.to("#r .sweep",{x:2200,duration:1.3,ease:"power1.inOut"},6.7);
  tl.to("#r .sweep",{opacity:0,duration:.4},7.5);
  window.__timelines["reelN2"]=tl;
  </script>
</div></body></html>
