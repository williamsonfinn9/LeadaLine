<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face{font-family:'Archivo';font-style:normal;font-weight:800;font-display:block;src:url('fonts/Archivo-800.woff2') format('woff2');}
  @font-face{font-family:'Archivo';font-style:normal;font-weight:900;font-display:block;src:url('fonts/Archivo-900.woff2') format('woff2');}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:block;src:url('fonts/DMSans-400.woff2') format('woff2');}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:block;src:url('fonts/DMSans-500.woff2') format('woff2');}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:block;src:url('fonts/DMSans-600.woff2') format('woff2');}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:block;src:url('fonts/DMSans-700.woff2') format('woff2');}
  @font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:block;src:url('fonts/DMMono-400.woff2') format('woff2');}
  @font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:block;src:url('fonts/DMMono-500.woff2') format('woff2');}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050B1A; }

  #r01 { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(135% 100% at 50% 12%, #0E2240 0%, #091833 40%, #050B1A 78%);
    font-family: 'DM Sans', system-ui, sans-serif; color: #F8FAFC;
    --cy: #18D7FF; --bl: #2563FF; --vi: #7C5CFF; --sl: #94A3B8; }
  #r01 .world { position: absolute; inset: 0; transform-origin: 50% 42%; }

  /* ambient depth */
  #r01 .orb { position: absolute; border-radius: 50%; filter: blur(70px); z-index: 0; pointer-events: none; opacity: 0; }
  #r01 .orb.a { width: 720px; height: 720px; left: -180px; top: 480px; background: radial-gradient(circle, rgba(37,99,255,.30), rgba(37,99,255,0) 68%); }
  #r01 .orb.b { width: 640px; height: 640px; right: -200px; top: 880px; background: radial-gradient(circle, rgba(124,92,255,.26), rgba(124,92,255,0) 68%); }
  #r01 .orb.c { width: 520px; height: 520px; left: 50%; top: 1280px; transform: translateX(-50%); background: radial-gradient(circle, rgba(24,215,255,.20), rgba(24,215,255,0) 68%); }

  #r01 .flash { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 80% at 50% 26%, rgba(239,68,68,.55), rgba(239,68,68,0) 60%); }
  #r01 .snap { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0; background: #EAF4FF; }
  #r01 .sweep { position: absolute; top: -10%; left: -60%; width: 55%; height: 120%; z-index: 1; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent, rgba(120,180,255,.10) 45%, rgba(190,225,255,.20) 50%, rgba(120,180,255,.10) 55%, transparent);
    transform: skewX(-12deg); filter: blur(8px); }
  #r01 .grain { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: .035; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  #r01 .vignette { position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(125% 85% at 50% 40%, transparent 58%, rgba(2,6,16,.5) 100%); }

  /* content */
  #r01 .content { position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; padding: 172px 96px 108px; }

  #r01 .headline { font-family: 'Archivo', sans-serif; font-weight: 900; text-transform: uppercase;
    text-align: center; font-size: 112px; line-height: .98; letter-spacing: -2.5px; text-shadow: 0 0 60px rgba(37,99,255,.22); }
  #r01 .headline .l1, #r01 .headline .l2 { display: block; white-space: nowrap; }
  #r01 .eq { color: var(--cy); text-shadow: 0 0 44px rgba(24,215,255,.6); }

  #r01 .divider { position: relative; margin: 40px 0 34px; height: 1.5px; width: 190px; }
  #r01 .divider .line { position: absolute; inset: 0; border-radius: 2px; transform: scaleX(0);
    background: linear-gradient(90deg, transparent, var(--cy), transparent); }
  #r01 .divider .node { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%;
    transform: translate(-50%,-50%); background: #d6f3ff; box-shadow: 0 0 20px 5px rgba(24,215,255,.85); opacity: 0; }

  #r01 .sub { text-align: center; font-size: 43px; font-weight: 500; line-height: 1.3; color: #BFD0E6; max-width: 720px; letter-spacing: .2px; }

  /* stage */
  #r01 .stage { position: relative; width: 100%; flex: 1; margin-top: 64px; min-height: 720px; }

  #r01 .phone { position: absolute; left: 30px; top: 168px; width: 300px; height: 408px; border-radius: 34px;
    background: linear-gradient(165deg, rgba(18,30,52,.82), rgba(10,18,38,.82)); border: 1px solid rgba(148,163,184,.12);
    box-shadow: 0 40px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  #r01 .phone .pl { font-size: 28px; font-weight: 600; color: #AEBCCF; letter-spacing: .3px; }
  #r01 .phone .ring { width: 120px; height: 120px; border-radius: 50%; border: 1.5px solid rgba(148,163,184,.24); display: flex; align-items: center; justify-content: center; }
  #r01 .phone .ring svg { width: 56px; height: 56px; stroke: #7E8DA3; }
  #r01 .phone .time { font-family:'DM Mono', monospace; font-size: 27px; color: #6C7B92; }

  /* electric-blue transfer line */
  #r01 .transfer { position: absolute; left: 330px; top: 352px; width: 268px; height: 30px; opacity: 0; }
  #r01 .transfer .beam { position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleX(0); transform-origin: left center;
    height: 5px; width: 230px; border-radius: 5px; background: linear-gradient(90deg, rgba(24,215,255,0), var(--cy) 35%, var(--bl)); box-shadow: 0 0 26px rgba(24,215,255,.8); }
  #r01 .transfer .head { position: absolute; right: 16px; top: 50%; transform: translateY(-50%) rotate(45deg);
    width: 24px; height: 24px; border-top: 5px solid var(--bl); border-right: 5px solid var(--bl); border-radius: 3px; box-shadow: 0 0 18px rgba(37,99,255,.7); }
  #r01 .transfer .packet { position: absolute; left: 0; top: 50%; width: 30px; height: 12px; transform: translateY(-50%); border-radius: 8px;
    background: radial-gradient(circle, rgba(230,250,255,1), rgba(24,215,255,0) 70%); }

  /* premium glass lead-summary card */
  #r01 .card { position: absolute; right: 18px; top: 80px; width: 466px; height: 632px; border-radius: 36px;
    background: linear-gradient(165deg, rgba(28,48,84,.82), rgba(12,24,50,.88));
    border: 1px solid rgba(120,180,255,.32);
    box-shadow: 0 50px 120px rgba(2,8,24,.62), 0 0 70px rgba(37,99,255,.24), inset 0 1px 0 rgba(255,255,255,.10);
    padding: 38px 32px; }
  #r01 .card .gloss { position: absolute; inset: 0; border-radius: 36px; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,0) 32%); }
  #r01 .card .ctitle { font-size: 39px; font-weight: 700; line-height: 1.06; position: relative; }
  #r01 .card .ctitle .accent { color: var(--cy); display:block; }
  #r01 .card .cap { display: flex; align-items: center; gap: 16px; margin-top: 30px; position: relative;
    background: linear-gradient(120deg, rgba(37,99,255,.20), rgba(24,215,255,.09)); border: 1px solid rgba(37,99,255,.42); border-radius: 18px; padding: 17px 18px; }
  #r01 .card .cap .chk { width: 46px; height: 46px; border-radius: 50%; flex: 0 0 46px; background: linear-gradient(135deg, var(--cy), var(--bl));
    display:flex; align-items:center; justify-content:center; box-shadow: 0 0 20px rgba(24,215,255,.55); }
  #r01 .card .cap .chk svg { width: 24px; height: 24px; stroke: #fff; }
  #r01 .card .cap .ct { font-size: 23px; font-weight: 600; }
  #r01 .card .cap .cs { font-family:'DM Mono',monospace; font-size: 18px; color: var(--cy); margin-top: 2px; }

  #r01 .card .row { display: flex; align-items: center; gap: 16px; margin-top: 16px; position: relative;
    background: rgba(255,255,255,.04); border: 1px solid rgba(148,163,184,.12); border-radius: 16px; padding: 15px 16px; }
  #r01 .card .row .tile { width: 46px; height: 46px; flex:0 0 46px; border-radius: 13px; display:flex; align-items:center; justify-content:center; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  #r01 .card .row .tile svg { width: 24px; height: 24px; stroke: #fff; }
  #r01 .card .row .t-cy { background: linear-gradient(135deg, #29D8F6, #1597D6); }
  #r01 .card .row .t-bl { background: linear-gradient(135deg, #3B7BFF, #1E47D6); }
  #r01 .card .row .t-vi { background: linear-gradient(135deg, #8E73FF, #6A45E6); }
  #r01 .card .row .bars { flex: 1; display: flex; flex-direction: column; gap: 9px; position: relative; overflow: hidden; }
  #r01 .card .row .bar { height: 9px; border-radius: 6px; background: linear-gradient(90deg, rgba(140,170,225,.55), rgba(140,170,225,.16)); }
  #r01 .card .row .bar.short { width: 56%; }
  #r01 .card .row .shimmer { position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(200,228,255,.35), transparent); }

  #r01 .card .deliver { position: absolute; left: 32px; right: 32px; bottom: 32px; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(120deg, var(--bl), #1b4fd6); border-radius: 18px; padding: 19px 22px; box-shadow: 0 14px 34px rgba(37,99,255,.42); }
  #r01 .card .deliver .dt { font-size: 23px; font-weight: 700; }
  #r01 .card .deliver .chk { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; }
  #r01 .card .deliver .chk svg { width: 22px; height: 22px; stroke:#fff; }

  /* logo */
  #r01 .logo { display: flex; align-items: center; gap: 20px; margin-top: 6px; position: relative; }
  #r01 .logo .ring2 { position: absolute; left: 8px; top: 50%; width: 70px; height: 70px; border-radius: 50%; transform: translate(-10%,-50%) scale(0.4);
    border: 2px solid rgba(24,215,255,.7); opacity: 0; pointer-events: none; }
  #r01 .logo .mark { width: 64px; height: 64px; filter: drop-shadow(0 6px 18px rgba(37,99,255,.45)); }
  #r01 .logo .wm { font-size: 56px; font-weight: 600; letter-spacing: -.5px; color: #F4F8FF; }
</style>
</head>
<body>
<div id="r01" data-composition-id="reel01" data-start="0" data-duration="8" data-width="1080" data-height="1920">
  <div class="world">
    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
    <div class="flash"></div>
    <div class="sweep"></div>

    <div class="content">
      <h1 class="headline">
        <span class="l1">MISSED CALL</span>
        <span class="l2"><span class="eq">=</span> MISSED JOB</span>
      </h1>

      <div class="divider"><div class="line"></div><div class="node"></div></div>
      <p class="sub">Capture the enquiry<br>before it disappears.</p>

      <div class="stage">
        <div class="phone">
          <div class="pl">Missed Call</div>
          <div class="ring">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
              <line x1="15" y1="4" x2="21" y2="10"/><line x1="21" y1="4" x2="15" y2="10"/>
            </svg>
          </div>
          <div class="time">10:42 AM</div>
        </div>

        <div class="transfer"><div class="beam"></div><div class="packet"></div><div class="head"></div></div>

        <div class="card">
          <div class="gloss"></div>
          <div class="ctitle">Lead Summary <span class="accent">Sent</span></div>
          <div class="cap">
            <div class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <div><div class="ct">New Enquiry Captured</div><div class="cs">10:42 AM</div></div>
          </div>
          <div class="row r1">
            <div class="tile t-cy"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
            <div class="bars"><div class="bar"></div><div class="bar short"></div><div class="shimmer"></div></div>
          </div>
          <div class="row r2">
            <div class="tile t-bl"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
            <div class="bars"><div class="bar"></div><div class="bar short"></div><div class="shimmer"></div></div>
          </div>
          <div class="row r3">
            <div class="tile t-vi"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
            <div class="bars"><div class="bar"></div><div class="bar short"></div><div class="shimmer"></div></div>
          </div>
          <div class="deliver">
            <div class="dt">Lead Summary Delivered</div>
            <div class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
          </div>
        </div>
      </div>

      <div class="logo">
        <div class="ring2"></div>
        <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <defs><linearGradient id="lg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
            <stop stop-color="#18D7FF"/><stop offset="0.5" stop-color="#2563FF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs>
          <rect x="13" y="7" width="14" height="50" rx="7" fill="url(#lg)"/>
          <rect x="13" y="43" width="40" height="14" rx="7" fill="url(#lg)"/>
          <rect x="33" y="7" width="11" height="28" rx="5.5" fill="#18D7FF" opacity="0.95"/>
        </svg>
        <div class="wm">LeadaLine</div>
      </div>
    </div>

    <div class="vignette"></div>
    <div class="snap"></div>
    <div class="grain"></div>
  </div>

  <script src="./gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const snap = "back.out(1.7)", soft = "power3.out", smooth = "power2.out";

    // ambient orbs settle quickly
    tl.to("#r01 .orb.a", { opacity: 1, duration: 1.0, ease: "sine.out" }, 0);
    tl.to("#r01 .orb.b", { opacity: 1, duration: 1.1, ease: "sine.out" }, 0.1);
    tl.to("#r01 .orb.c", { opacity: 1, duration: 1.1, ease: "sine.out" }, 0.2);

    // 0.0s WARNING HIT: red bloom + zoom + shake
    tl.fromTo("#r01 .flash", { opacity: 0 }, { opacity: 0.9, duration: 0.10, ease: "power2.out" }, 0.0);
    tl.to("#r01 .flash", { opacity: 0, duration: 0.42, ease: "power2.in" }, 0.12);
    tl.from("#r01 .world", { scale: 1.07, duration: 0.62, ease: "power3.out", transformOrigin: "50% 42%" }, 0.0);
    tl.to("#r01 .content", { keyframes: { x: [0, -9, 7, -5, 3, 0], y: [0, 5, -4, 2, -1, 0] }, duration: 0.30, ease: "none" }, 0.02);

    // 0.28s SNAP -> headline (instant readable)
    tl.fromTo("#r01 .snap", { opacity: 0 }, { opacity: 0.42, duration: 0.06, ease: "power2.out" }, 0.26);
    tl.to("#r01 .snap", { opacity: 0, duration: 0.18, ease: "power2.in" }, 0.32);
    tl.from("#r01 .headline .l1", { y: 36, scale: 0.92, opacity: 0, duration: 0.30, ease: snap }, 0.28);
    tl.from("#r01 .eq", { scale: 0, opacity: 0, duration: 0.32, ease: "back.out(2.2)" }, 0.40);
    tl.from("#r01 .headline .l2", { y: 32, scale: 0.92, opacity: 0, duration: 0.30, ease: snap }, 0.42);

    // first light sweep (energy in first 2s)
    tl.fromTo("#r01 .sweep", { x: 0, opacity: 0 }, { opacity: 1, duration: 0.25, ease: "sine.out" }, 0.55);
    tl.to("#r01 .sweep", { x: 2200, duration: 1.15, ease: "power1.inOut" }, 0.55);
    tl.to("#r01 .sweep", { opacity: 0, duration: 0.3, ease: "sine.in" }, 1.5);

    // divider + sub (fast, no blur)
    tl.to("#r01 .divider .line", { scaleX: 1, duration: 0.34, ease: "power2.inOut" }, 0.72);
    tl.to("#r01 .divider .node", { opacity: 1, duration: 0.3, ease: "sine.out" }, 0.98);
    tl.from("#r01 .sub", { y: 18, opacity: 0, duration: 0.32, ease: smooth }, 0.82);

    // 1.5s missed call card snaps in
    tl.from("#r01 .phone", { y: 40, scale: 0.9, opacity: 0, duration: 0.42, ease: "back.out(1.5)" }, 1.45);

    // 2.0s electric-blue transfer line -> fires toward summary
    tl.fromTo("#r01 .transfer", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out" }, 2.05);
    tl.fromTo("#r01 .transfer .beam", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.1);
    tl.fromTo("#r01 .transfer .packet", { x: 0, opacity: 0 }, { opacity: 1, duration: 0.15, ease: "sine.out" }, 2.2);
    tl.to("#r01 .transfer .packet", { x: 230, duration: 0.6, ease: "power1.in" }, 2.3);
    tl.to("#r01 .transfer .packet", { opacity: 0, duration: 0.15 }, 2.78);

    // 3.0s lead summary card reveal + glow bloom
    tl.from("#r01 .card", { y: 56, scale: 0.93, opacity: 0, duration: 0.5, ease: soft }, 2.95);
    tl.fromTo("#r01 .card",
      { boxShadow: "0 50px 120px rgba(2,8,24,.62), 0 0 40px rgba(37,99,255,.2), inset 0 1px 0 rgba(255,255,255,.10)" },
      { boxShadow: "0 50px 120px rgba(2,8,24,.62), 0 0 120px rgba(37,99,255,.6), inset 0 1px 0 rgba(255,255,255,.12)", duration: 0.45, ease: "sine.out" }, 3.0);
    tl.from("#r01 .card .ctitle", { y: 18, opacity: 0, duration: 0.34, ease: smooth }, 3.2);

    // captured + check
    tl.from("#r01 .card .cap", { y: 18, opacity: 0, duration: 0.34, ease: soft }, 3.45);
    tl.from("#r01 .card .cap .chk", { scale: 0, opacity: 0, duration: 0.36, ease: "back.out(2.2)" }, 3.6);

    // rows quick stagger
    tl.from("#r01 .card .r1", { y: 16, opacity: 0, duration: 0.30, ease: smooth }, 3.85);
    tl.from("#r01 .card .r1 .tile", { scale: 0.5, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 3.94);
    tl.from("#r01 .card .r2", { y: 16, opacity: 0, duration: 0.30, ease: smooth }, 4.05);
    tl.from("#r01 .card .r2 .tile", { scale: 0.5, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 4.14);
    tl.from("#r01 .card .r3", { y: 16, opacity: 0, duration: 0.30, ease: smooth }, 4.25);
    tl.from("#r01 .card .r3 .tile", { scale: 0.5, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 4.34);

    // shimmer sweep across rows
    tl.fromTo("#r01 .card .row .shimmer", { x: 0 }, { x: 900, duration: 1.1, ease: "power1.inOut", stagger: 0.10 }, 4.5);

    // 4.9s delivered bar + clean UI pulse
    tl.from("#r01 .card .deliver", { y: 26, opacity: 0, duration: 0.4, ease: soft }, 4.9);
    tl.from("#r01 .card .deliver .chk", { scale: 0, opacity: 0, duration: 0.4, ease: "back.out(2.3)" }, 5.15);
    tl.fromTo("#r01 .card .deliver",
      { boxShadow: "0 14px 34px rgba(37,99,255,.42)" },
      { boxShadow: "0 14px 50px rgba(37,99,255,.85)", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.15);

    // 5.6s BRIGHT confident logo finish
    tl.from("#r01 .logo .mark", { scale: 0.55, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 5.6);
    tl.from("#r01 .logo .wm", { x: -22, opacity: 0, duration: 0.5, ease: soft }, 5.75);
    tl.fromTo("#r01 .logo .ring2", { scale: 0.4, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 5.75);
    tl.fromTo("#r01 .logo .mark", { filter: "drop-shadow(0 6px 18px rgba(37,99,255,.45))" },
      { filter: "drop-shadow(0 6px 30px rgba(24,215,255,.95))", duration: 0.5, ease: "sine.out" }, 5.95);
    tl.to("#r01 .logo .wm", { textShadow: "0 0 26px rgba(120,180,255,.6)", duration: 0.5, ease: "sine.out" }, 5.95);

    // confident hold: gentle drift + one more sweep
    tl.to("#r01 .stage", { y: -8, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.0);
    tl.fromTo("#r01 .sweep", { x: 0, opacity: 0 }, { opacity: 0.7, duration: 0.3, ease: "sine.out" }, 6.4);
    tl.to("#r01 .sweep", { x: 2200, duration: 1.4, ease: "power1.inOut" }, 6.4);
    tl.to("#r01 .sweep", { opacity: 0, duration: 0.4, ease: "sine.in" }, 7.4);
    tl.to("#r01 .logo .mark", { filter: "drop-shadow(0 6px 24px rgba(24,215,255,.7))", duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.6);

    window.__timelines["reel01"] = tl;
  </script>
</div>
</body>
</html>
